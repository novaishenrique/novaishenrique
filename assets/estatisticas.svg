  <g class="a" style="animation-delay:0.12s"><circle cx="32" cy="90" r="4" fill="#ff6e96"/><text class="r" x="45" y="95">Pull requests:</text><text class="v" x="230" y="95">1</text></g>
  <g class="a" style="animation-delay:0.24s"><circle cx="32" cy="115" r="4" fill="#ff6e96"/><text class="r" x="45" y="120">Issues:</text><text class="v" x="230" y="120">1</text></g>
