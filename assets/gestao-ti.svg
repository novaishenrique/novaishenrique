<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-labelledby="t d">
  <title id="t">Gestão da TI: dados, processos e governança</title>
  <desc id="d">Animação em preto e branco de um painel de indicadores alimentado por um banco de dados, uma engrenagem de processos e um escudo de governança.</desc>
  <defs>
    <pattern id="pontos" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#2a2a2a"/>
    </pattern>
    <style>
      .barra { transform-box: fill-box; transform-origin: 50% 100%; animation: subir 3.2s ease-in-out infinite alternate; }
      @keyframes subir { 0% { transform: scaleY(.25) } 100% { transform: scaleY(1) } }
      .linha { stroke-dasharray: 1; stroke-dashoffset: 1; animation: desenhar 4s ease-in-out infinite; }
      @keyframes desenhar { 0% { stroke-dashoffset: 1 } 45%, 85% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: -1 } }
      .pontos-linha { animation: aparecer 4s ease-in-out infinite; }
      @keyframes aparecer { 0%, 35% { opacity: 0 } 50%, 85% { opacity: 1 } 100% { opacity: 0 } }
      .anel { stroke-dasharray: 81.7; animation: encher 4s ease-in-out infinite; }
      @keyframes encher { 0% { stroke-dashoffset: 81.7 } 50%, 85% { stroke-dashoffset: 1.6 } 100% { stroke-dashoffset: 81.7 } }
      .girar { transform-box: fill-box; transform-origin: center; animation: girar 6s linear infinite; }
      @keyframes girar { to { transform: rotate(360deg) } }
      .check { stroke-dasharray: 1; stroke-dashoffset: 1; animation: check 3s ease-out infinite; }
      @keyframes check { 0%, 20% { stroke-dashoffset: 1 } 50%, 100% { stroke-dashoffset: 0 } }
      .disco { animation: piscar 1.6s ease-in-out infinite; }
      .disco2 { animation-delay: .8s; }
      @keyframes piscar { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
      .cursor { animation: cursor 1s steps(1) infinite; }
      @keyframes cursor { 50% { opacity: 0 } }
      .rotulo { font: 400 11px 'Courier New', Consolas, 'DejaVu Sans Mono', monospace; fill: #bdbdbd; }
      .mini { font: 400 8px 'Courier New', Consolas, 'DejaVu Sans Mono', monospace; fill: #8a8a8a; }
      .kpi { font: 700 8px 'Courier New', Consolas, 'DejaVu Sans Mono', monospace; fill: #fff; }
    </style>
  </defs>

  <rect width="300" height="300" fill="#000"/>
  <rect width="300" height="300" fill="url(#pontos)"/>

  <!-- conexões e dados chegando ao painel -->
  <path d="M60 214 C60 196 82 186 100 172" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="3 4"/><path d="M150 214 L150 196" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="3 4"/><path d="M240 214 C240 196 218 186 200 172" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle r="2.6" fill="#fff" opacity="0"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.0s" path="M60 214 C60 196 82 186 100 172"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite" begin="0.0s"/></circle><circle r="2.6" fill="#fff" opacity="0"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.2s" path="M60 214 C60 196 82 186 100 172"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite" begin="1.2s"/></circle><circle r="2.6" fill="#fff" opacity="0"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.5s" path="M150 214 L150 196"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite" begin="0.5s"/></circle><circle r="2.6" fill="#fff" opacity="0"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.7s" path="M150 214 L150 196"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite" begin="1.7s"/></circle><circle r="2.6" fill="#fff" opacity="0"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.0s" path="M240 214 C240 196 218 186 200 172"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite" begin="1.0s"/></circle><circle r="2.6" fill="#fff" opacity="0"><animateMotion dur="2.4s" repeatCount="indefinite" begin="2.2s" path="M240 214 C240 196 218 186 200 172"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite" begin="2.2s"/></circle>

  <!-- monitor com o painel -->
  <rect x="40" y="28" width="220" height="142" rx="10" fill="#0a0a0a" stroke="#e4e2e2" stroke-width="2"/>
  <rect x="134" y="170" width="32" height="18" fill="#1c1c1c" stroke="#e4e2e2" stroke-width="1.5"/>
  <rect x="112" y="188" width="76" height="7" rx="3" fill="#e4e2e2"/>
  <circle cx="58" cy="42" r="2.6" fill="#5a5a5a"/><circle cx="67" cy="42" r="2.6" fill="#5a5a5a"/><circle cx="76" cy="42" r="2.6" fill="#5a5a5a"/>
  <text class="mini" x="88" y="45">painel_ti.sql<tspan class="cursor">_</tspan></text>
  <line x1="52" y1="52" x2="248" y2="52" stroke="#2a2a2a"/>

  <!-- barras -->
  <line x1="56" y1="148.5" x2="148" y2="148.5" stroke="#3a3a3a"/>
  <rect class="barra" x="60" y="109.5" width="12" height="38.5" rx="2" fill="#ffffff" style="animation-delay:0.0s"/><rect class="barra" x="78" y="92.0" width="12" height="56.0" rx="2" fill="#9a9a9a" style="animation-delay:0.3s"/><rect class="barra" x="96" y="116.5" width="12" height="31.5" rx="2" fill="#ffffff" style="animation-delay:0.6s"/><rect class="barra" x="114" y="81.5" width="12" height="66.5" rx="2" fill="#9a9a9a" style="animation-delay:0.9s"/><rect class="barra" x="132" y="99.0" width="12" height="49.0" rx="2" fill="#ffffff" style="animation-delay:1.2s"/>

  <!-- linha de tendência -->
  <text class="mini" x="160" y="64">tendência</text>
  <polyline class="linha" pathLength="1" points="162,104 176,96 190,100 204,84 218,88 232,70 244,66" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <g class="pontos-linha"><circle cx="162" cy="104" r="2.2" fill="#000" stroke="#fff" stroke-width="1.4"/><circle cx="176" cy="96" r="2.2" fill="#000" stroke="#fff" stroke-width="1.4"/><circle cx="190" cy="100" r="2.2" fill="#000" stroke="#fff" stroke-width="1.4"/><circle cx="204" cy="84" r="2.2" fill="#000" stroke="#fff" stroke-width="1.4"/><circle cx="218" cy="88" r="2.2" fill="#000" stroke="#fff" stroke-width="1.4"/><circle cx="232" cy="70" r="2.2" fill="#000" stroke="#fff" stroke-width="1.4"/><circle cx="244" cy="66" r="2.2" fill="#000" stroke="#fff" stroke-width="1.4"/></g>

  <!-- indicador (KPI) -->
  <g transform="translate(176 134)">
    <circle r="13" fill="none" stroke="#2f2f2f" stroke-width="4"/>
    <circle class="anel" r="13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" transform="rotate(-90)"/>
    <text class="kpi" text-anchor="middle" y="3">SLA</text>
  </g>
  <text class="mini" x="196" y="131">99,5%</text>
  <text class="mini" x="196" y="142">no prazo</text>

  <!-- dados: banco de dados -->
  <g transform="translate(60 240)">
    <ellipse cx="0" cy="-17" rx="20" ry="7" fill="#0a0a0a" stroke="#e4e2e2" stroke-width="2"/>
    <path d="M-20 -17 V17 C-20 21 -11 24 0 24 C11 24 20 21 20 17 V-17" fill="none" stroke="#e4e2e2" stroke-width="2"/>
    <path d="M-20 -3 C-20 1 -11 4 0 4 C11 4 20 1 20 -3" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
    <path d="M-20 9 C-20 13 -11 16 0 16 C11 16 20 13 20 9" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
    <circle class="disco" cx="12" cy="4" r="1.8" fill="#fff"/>
    <circle class="disco disco2" cx="12" cy="16" r="1.8" fill="#fff"/>
  </g>

  <!-- processos: engrenagem -->
  <g class="girar">
    <path d="M165.8,235.7 L171.4,237.1 L171.4,246.9 L165.8,248.3 L165.6,248.8 L168.6,253.7 L161.7,260.6 L156.8,257.6 L156.3,257.8 L154.9,263.4 L145.1,263.4 L143.7,257.8 L143.2,257.6 L138.3,260.6 L131.4,253.7 L134.4,248.8 L134.2,248.3 L128.6,246.9 L128.6,237.1 L134.2,235.7 L134.4,235.2 L131.4,230.3 L138.3,223.4 L143.2,226.4 L143.7,226.2 L145.1,220.6 L154.9,220.6 L156.3,226.2 L156.8,226.4 L161.7,223.4 L168.6,230.3 L165.6,235.2 Z" fill="#0a0a0a" stroke="#e4e2e2" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="150" cy="242" r="6.5" fill="#000" stroke="#e4e2e2" stroke-width="2"/>
  </g>

  <!-- governança: escudo com check -->
  <g transform="translate(240 240)">
    <path d="M0 -24 L20 -16 V0 C20 13 11 22 0 26 C-11 22 -20 13 -20 0 V-16 Z" fill="#0a0a0a" stroke="#e4e2e2" stroke-width="2" stroke-linejoin="round"/>
    <path class="check" pathLength="1" d="M-9 1 L-2 8 L10 -6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text class="rotulo" x="60" y="288" text-anchor="middle">dados</text>
  <text class="rotulo" x="150" y="288" text-anchor="middle">processos</text>
  <text class="rotulo" x="240" y="288" text-anchor="middle">governança</text>
</svg>
