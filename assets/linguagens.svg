<svg xmlns="http://www.w3.org/2000/svg" width="350" height="195" viewBox="0 0 350 195" role="img" aria-label="Linguagens mais usadas nos repositórios públicos">
  <title>Linguagens mais usadas nos repositórios públicos</title>
  <style>
    .t { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #ff8fb1; }
    .r { font: 400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #e6e1f5; }
    .v { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #ffd27a; }
    .n { font: 700 28px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #e6e1f5; }
    .p { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #e6e1f5; opacity: .75; }
    .a { animation: surgir .8s ease-out both; }
    @keyframes surgir { from { opacity: 0 } to { opacity: 1 } }
  </style>
  <rect x="0.5" y="0.5" width="349" height="194" rx="10" fill="#1a1b2e" stroke="#3b2f5c"/>
  <text class="t" x="25" y="35">Linguagens mais usadas</text>
  <clipPath id="c"><rect x="25" y="52" width="300" height="10" rx="5"/></clipPath>
  <g clip-path="url(#c)">
  <rect x="25.0" y="52" width="150.0" height="10" fill="#f1e05a"/>
  <rect x="175.0" y="52" width="95.4" height="10" fill="#555555"/>
  <rect x="270.4" y="52" width="54.6" height="10" fill="#89e051"/>
  </g>
  <g class="a" style="animation-delay:0.00s"><circle cx="30" cy="88" r="5" fill="#f1e05a"/><text class="r" x="42" y="92">JavaScript <tspan class="p">50.0%</tspan></text></g>
  <g class="a" style="animation-delay:0.12s"><circle cx="180" cy="88" r="5" fill="#555555"/><text class="r" x="192" y="92">C <tspan class="p">31.8%</tspan></text></g>
  <g class="a" style="animation-delay:0.24s"><circle cx="30" cy="116" r="5" fill="#89e051"/><text class="r" x="42" y="120">Shell <tspan class="p">18.2%</tspan></text></g>
</svg>
