<svg xmlns="http://www.w3.org/2000/svg" width="350" height="195" viewBox="0 0 350 195" role="img" aria-label="Linguagens mais usadas nos repositórios públicos">
  <title>Linguagens mais usadas nos repositórios públicos</title>
  <style>
    .t { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #ffffff; }
    .r { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #d9d9d9; }
    .v { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #ffffff; }
    .n { font: 700 28px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #ffffff; }
    .p { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #d9d9d9; opacity: .7; }
    .x { font: 400 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #d9d9d9; opacity: .8; }
    .a { animation: surgir .8s ease-out both; }
    @keyframes surgir { from { opacity: 0 } to { opacity: 1 } }
    .anel { animation: encher 1.2s ease-out both; }
  </style>
  <rect x="0.5" y="0.5" width="349" height="194" rx="6" fill="#000000" stroke="#e4e2e2"/>
  <text class="t" x="25" y="35" text-anchor="start">Linguagens mais usadas</text>
  <clipPath id="c"><rect x="25" y="52" width="300" height="10" rx="5"/></clipPath>
  <g clip-path="url(#c)">
  <rect x="25.0" y="52" width="291.5" height="10" fill="#ffffff"/>
  <rect x="316.5" y="52" width="5.4" height="10" fill="#c9c9c9"/>
  <rect x="321.9" y="52" width="3.1" height="10" fill="#9a9a9a"/>
  </g>
  <g class="a" style="animation-delay:0.00s"><circle cx="30" cy="88" r="5" fill="#ffffff" stroke="#3a3a3a"/><text class="r" x="42" y="92">HTML <tspan class="p">97.2%</tspan></text></g>
  <g class="a" style="animation-delay:0.12s"><circle cx="180" cy="88" r="5" fill="#c9c9c9" stroke="#3a3a3a"/><text class="r" x="192" y="92">C <tspan class="p">1.8%</tspan></text></g>
  <g class="a" style="animation-delay:0.24s"><circle cx="30" cy="116" r="5" fill="#9a9a9a" stroke="#3a3a3a"/><text class="r" x="42" y="120">Shell <tspan class="p">1.0%</tspan></text></g>
</svg>
