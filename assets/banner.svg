<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Bem-vindo ao GitHub do Henrique</title>
  <desc id="descricao">Paisagem em preto e branco com dunas e um rio sinuoso até o horizonte.</desc>
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f8f8f"/>
      <stop offset="0.38" stop-color="#cfcfcf"/>
      <stop offset="0.6" stop-color="#f4f4f4"/>
    </linearGradient>
    <radialGradient id="claridade" cx="0.5" cy="0.58" r="0.45">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="longe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8a8a"/><stop offset="0.25" stop-color="#4d4d4d"/><stop offset="1" stop-color="#1e1e1e"/>
    </linearGradient>
    <linearGradient id="meio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c3c"/><stop offset="0.3" stop-color="#161616"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="perto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/><stop offset="0.35" stop-color="#050505"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#e9e9e9"/><stop offset="1" stop-color="#9c9c9c"/>
    </linearGradient>
    <radialGradient id="vale" cx="0.5" cy="0.72" r="0.38">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .titulo { font: 400 40px 'Courier New', Consolas, 'DejaVu Sans Mono', monospace; fill: #262626; letter-spacing: 1px; }
      .tag { font: 400 30px 'Courier New', Consolas, 'DejaVu Sans Mono', monospace; fill: #2e2e2e; }
      .surgir { animation: surgir 2s ease-out both; }
      .surgir2 { animation: surgir 2s ease-out .6s both; }
      @keyframes surgir { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
      .cursor { animation: piscar 1.1s steps(1) infinite; }
      @keyframes piscar { 50% { opacity: 0 } }
      .brilho { stroke: #fff; stroke-width: 2; stroke-linecap: round; opacity: 0; animation: reluz 3.2s ease-in-out infinite; }
      @keyframes reluz { 0%, 100% { opacity: 0 } 50% { opacity: .9 } }
    </style>
  </defs>

  <rect width="1200" height="440" fill="url(#ceu)"/>
  <rect width="1200" height="440" fill="url(#claridade)"/>

