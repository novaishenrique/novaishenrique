<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-labelledby="t d">
  <title id="t">Astronauta flutuando</title>
  <desc id="d">Animação em preto e branco de um astronauta flutuando no espaço entre estrelas.</desc>
  <defs>
    <radialGradient id="capacete" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bdbdbd"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/><stop offset="0.55" stop-color="#111"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="roupa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c8c8c8"/>
    </linearGradient>
    <style>
      .e { fill: #fff; animation: piscar 4s ease-in-out infinite; }
      .e2 { animation-delay: 1.3s; } .e3 { animation-delay: 2.6s; }
      @keyframes piscar { 0%, 100% { opacity: .2 } 50% { opacity: 1 } }
      .flutuar { animation: flutuar 7s ease-in-out infinite; transform-origin: 150px 150px; }
      @keyframes flutuar {
        0%, 100% { transform: translate(0, 0) rotate(-14deg); }
        50% { transform: translate(6px, -12px) rotate(-4deg); }
      }
      .cabo { animation: cabo 7s ease-in-out infinite; }
      @keyframes cabo { 0%, 100% { d: path("M300 40 C240 70 220 40 176 104"); } 50% { d: path("M300 40 C250 60 226 30 182 92"); } }
    </style>
  </defs>

  <rect width="300" height="300" fill="#000"/>

  <!-- estrelas -->
  <g>
    <circle class="e" cx="22" cy="30" r="1.2"/><circle class="e e2" cx="70" cy="62" r="0.9"/>
    <circle class="e e3" cx="118" cy="18" r="1.1"/><circle class="e" cx="250" cy="22" r="0.8"/>
    <circle class="e e2" cx="276" cy="96" r="1.3"/><circle class="e e3" cx="30" cy="140" r="0.9"/>
    <circle class="e" cx="58" cy="236" r="1.2"/><circle class="e e2" cx="104" cy="282" r="0.8"/>
    <circle class="e e3" cx="214" cy="264" r="1.1"/><circle class="e" cx="268" cy="214" r="0.9"/>
    <circle class="e e2" cx="182" cy="40" r="0.7"/><circle class="e e3" cx="12" cy="200" r="0.8"/>
    <circle class="e" cx="290" cy="160" r="0.7"/><circle class="e e3" cx="146" cy="292" r="0.9"/>
    <circle class="e e2" cx="236" cy="128" r="0.6"/><circle class="e" cx="84" cy="168" r="0.6"/>
  </g>

  <!-- cabo de segurança -->
  <path class="cabo" d="M300 40 C240 70 220 40 176 104" fill="none" stroke="#9e9e9e" stroke-width="1.6" stroke-dasharray="3 4"/>

  <g class="flutuar">
    <!-- mochila -->
    <rect x="118" y="112" width="58" height="62" rx="12" fill="#a8a8a8"/>
    <!-- pernas -->
    <path d="M140 170 L128 214" stroke="url(#roupa)" stroke-width="20" stroke-linecap="round"/>
    <path d="M162 170 L176 210" stroke="url(#roupa)" stroke-width="20" stroke-linecap="round"/>
    <rect x="114" y="208" width="26" height="16" rx="6" fill="#dcdcdc" transform="rotate(14 127 216)"/>
    <rect x="166" y="204" width="26" height="16" rx="6" fill="#dcdcdc" transform="rotate(-18 179 212)"/>
    <!-- corpo -->
    <rect x="126" y="114" width="50" height="64" rx="18" fill="url(#roupa)"/>
    <rect x="138" y="134" width="26" height="18" rx="4" fill="#d6d6d6"/>
    <circle cx="145" cy="143" r="2.6" fill="#555"/><circle cx="155" cy="143" r="2.6" fill="#888"/>
    <!-- braços -->
    <path d="M128 126 L100 108" stroke="url(#roupa)" stroke-width="17" stroke-linecap="round"/>
    <path d="M174 126 L196 150" stroke="url(#roupa)" stroke-width="17" stroke-linecap="round"/>
    <circle cx="96" cy="105" r="9.5" fill="#dcdcdc"/>
    <circle cx="200" cy="154" r="9.5" fill="#dcdcdc"/>
    <!-- capacete -->
    <circle cx="151" cy="94" r="30" fill="url(#capacete)"/>
    <ellipse cx="156" cy="94" rx="21" ry="17" fill="url(#visor)"/>
    <path d="M144 84 Q150 79 158 80" stroke="#fff" stroke-opacity=".75" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="166" cy="102" r="2" fill="#fff" fill-opacity=".5"/>
  </g>
</svg>
