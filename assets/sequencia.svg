<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="Sequência atual de 2 dias e maior sequência de 2 dias">
  <title>Sequência atual de 2 dias e maior sequência de 2 dias</title>
  <style>
    .t { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #ff8fb1; }
    .r { font: 400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #e6e1f5; }
    .v { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #ffd27a; }
    .n { font: 700 28px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #e6e1f5; }
    .p { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #e6e1f5; opacity: .75; }
    .a { animation: surgir .8s ease-out both; }
    @keyframes surgir { from { opacity: 0 } to { opacity: 1 } }
  </style>
  <rect x="0.5" y="0.5" width="494" height="194" rx="10" fill="#1a1b2e" stroke="#3b2f5c"/>
  <text class="t" x="25" y="35">Dias seguidos de contribuição</text>
  <line x1="165" y1="55" x2="165" y2="175" stroke="#3b2f5c"/>
  <line x1="330" y1="55" x2="330" y2="175" stroke="#3b2f5c"/>
  <g class="a" text-anchor="middle">
    <text class="n" x="82" y="110">66</text>
    <text class="r" x="82" y="138">Contribuições</text>
    <text class="p" x="82" y="158">desde 17 ago 2026</text>
  </g>
  <g class="a" style="animation-delay:.2s" transform="translate(247 100)" text-anchor="middle">
    <circle r="38" fill="none" stroke="#3b2f5c" stroke-width="5"/>
    <circle r="38" fill="none" stroke="#ff6e96" stroke-width="5" stroke-linecap="round" stroke-dasharray="238.8" stroke-dashoffset="0.0" transform="rotate(-90)"/>
    <text class="n" y="10">2</text>
    <text class="r" y="62" style="fill:#ffd27a;font-weight:700">Sequência atual</text>
    <text class="p" y="80">desde 13 nov 2026</text>
  </g>
  <g class="a" style="animation-delay:.4s" text-anchor="middle">
    <text class="n" x="412" y="110">2</text>
    <text class="r" x="412" y="138">Maior sequência</text>
    <text class="p" x="412" y="158">2 nov 2026 – 3 nov 2026</text>
  </g>
</svg>
